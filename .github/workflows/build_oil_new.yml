name: Build Ramadan Oil Manager V2 PRO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract V2 PRO
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q Ramadan_Oil_Manager_V2_PRO.zip -d build-project
          echo "=== PROJECT CONTENTS ==="
          find build-project -maxdepth 3 -type f | head -80

      - name: Find and Build Project
        run: |
          PROJECT_DIR=$(find build-project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "Building project from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --console=plain --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find build-project -type f -name "app-debug.apk" | head -1)
          test -n "$APK" || { echo "APK NOT FOUND"; exit 1; }
          mkdir -p apk-output
          cp "$APK" apk-output/Ramadan-Oil-Manager-V2-PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Oil-Manager-V2-PRO-APK
          path: apk-output/Ramadan-Oil-Manager-V2-PRO.apk
          if-no-files-found: error
