name: Build Ramadan Oil Manager V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q Ramadan_Oil_Manager_V1_READY.zip -d build-project

      - name: Build APK
        run: |
          cd build-project/Ramadan_Oil_Manager_V1
          gradle :app:assembleDebug --console=plain

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp build-project/Ramadan_Oil_Manager_V1/app/build/outputs/apk/debug/app-debug.apk apk-output/Ramadan-Oil-Manager-V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Oil-Manager-V1-APK
          path: apk-output/Ramadan-Oil-Manager-V1.apk
          if-no-files-found: error
