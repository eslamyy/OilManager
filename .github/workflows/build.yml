name: Build Oil Manager V1.1.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          rm -rf oil-build
          mkdir oil-build
          unzip -q Oil_Manager_Standalone_V1_1_2_FIXED.zip -d oil-build

      - name: Build APK
        run: |
          cd oil-build/Oil_Manager_Standalone_V1
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cd oil-build/Oil_Manager_Standalone_V1/app/build/outputs/apk/debug
          cp app-debug.apk ../../../../../../../apk-output/Oil-Manager-V1.1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oil-Manager-V1.1.2-APK
          path: apk-output/Oil-Manager-V1.1.2.apk
          if-no-files-found: error
