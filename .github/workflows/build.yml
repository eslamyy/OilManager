name: Build Oil Manager V1.2.2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          rm -rf oil-build
          mkdir oil-build
          unzip -q Oil_Manager_Standalone_V1_2_2_READY.zip -d oil-build

      - name: Build APK
        run: |
          cd oil-build/Oil_Manager_Standalone_V1
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cd
