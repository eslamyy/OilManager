name: Build Oil Manager FRESH V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          rm -rf oil-build
          mkdir oil-build
          unzip -q Oil_Manager_FRESH_V1_READY.zip -d oil-build

      - name: Build APK
        run: |
          cd oil-build/Oil_Manager_FRESH_V1_READY
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp oil-build/Oil_Manager_FRESH_V1_READY/app/build/outputs/apk/debug/app-debug.apk apk-output/Oil-Manager-FRESH-V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oil-Manager-FRESH-V1-APK
          path: apk-output/Oil-Manager-FRESH-V1.apk
          if-no-files-found: error
