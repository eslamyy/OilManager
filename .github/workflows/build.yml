name: Diagnose Oil Manager Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract
        run: |
          rm -rf oil-build
          mkdir oil-build
          unzip -q Oil_Manager_Standalone_V1_1_2_FIXED.zip -d oil-build

      - name: Build APK
        run: |
          cd oil-build/Oil_Manager_Standalone_V1
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build-error.txt

      - name: Upload Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oil-Build-Error
          path: oil-build/Oil_Manager_Standalone_V1/build-error.txt
