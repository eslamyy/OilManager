name: Build Oil Manager V1.2 CLEAN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract
        run: |
          rm -rf oil-build
          mkdir oil-build
          unzip -q Oil_Manager_Standalone_V1_2_CLEAN.zip -d oil-build

      - name: Build APK
        run: |
          cd oil-build/Oil_Manager_Standalone_V1
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cd oil-build/Oil_Manager_Standalone_V1/app/build/outputs/apk/debug
          cp app-debug.apk ../../../../../../../apk-output/Oil-Manager-V1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oil-Manager-V1.2-APK
          path: apk-output/Oil-Manager-V1.2.apk
          if-no-files-found: error
